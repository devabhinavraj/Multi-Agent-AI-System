readme = "README.md"
authors = [
    { name = "Abhinav Raj", email = "abhinavraj1904@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.3.16",
    "langchain-core>=1.6.0",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
